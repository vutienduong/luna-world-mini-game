<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siêu Thị Mini Của Bé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Nunito", sans-serif;
      color: #3f3a4d;
      background: linear-gradient(145deg, #fff8dd, #eefdf4 55%, #eff6ff);
      padding: 18px;
      user-select: none;
    }
    .world-back-link {
      position: fixed; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
      z-index: 10; display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px;
      border-radius: 999px; background: rgba(255,255,255,0.92); border: 2px solid rgba(255,143,179,0.45);
      box-shadow: 0 8px 18px rgba(126,80,129,0.18); color: #9d2f61; font-weight: 900; text-decoration: none;
    }
    main { width: min(100%, 980px); margin: 54px auto 0; }
    h1 {
      margin: 0;
      font-family: "Baloo 2", sans-serif;
      font-size: clamp(2.8rem, 8vw, 5.8rem);
      line-height: 0.9;
      color: #41a873;
      text-align: center;
    }
    .lead { margin: 12px auto 22px; max-width: 640px; text-align: center; color: #6d6475; font-size: 1.1rem; font-weight: 900; }
    .layout { display: grid; grid-template-columns: 0.78fr 1.22fr; gap: 16px; }
    .list, .shelf {
      border-radius: 28px;
      background: rgba(255,255,255,0.78);
      border: 4px solid rgba(255,255,255,0.82);
      box-shadow: 0 20px 50px rgba(73,92,75,0.14);
      padding: 20px;
    }
    .list h2, .shelf h2 { margin: 0 0 14px; font-family: "Baloo 2", sans-serif; font-size: 2rem; line-height: 1; }
    .need { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 2px dashed rgba(65,168,115,0.18); font-weight: 900; }
    .need.done { color: #41a873; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    button.item {
      min-height: 112px;
      border: 0;
      border-radius: 22px;
      background: #fff;
      color: #3f3a4d;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 0 #d8e9d8, 0 16px 22px rgba(80,112,80,0.12);
      transition: transform 140ms ease;
    }
    button.item:active { transform: translateY(5px); box-shadow: 0 5px 0 #d8e9d8; }
    .emoji { display: block; font-size: 2.8rem; margin-bottom: 6px; }
    .cart {
      margin-top: 14px;
      min-height: 58px;
      padding: 12px;
      border-radius: 18px;
      background: #fffaf0;
      color: #8a6631;
      font-weight: 900;
    }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <a class="world-back-link" href="index.html" aria-label="Quay về bản đồ">🏡 Bản đồ</a>
  <main>
    <h1>Siêu Thị Mini</h1>
    <p class="lead">Mẹ đưa danh sách nhỏ. Bé chọn đúng số lượng đồ rồi bỏ vào giỏ hàng.</p>
    <div class="layout">
      <section class="list">
        <h2>Danh sách</h2>
        <div id="shopping-list"></div>
        <div class="cart" id="cart">Giỏ hàng: đang trống</div>
      </section>
      <section class="shelf">
        <h2>Kệ hàng</h2>
        <div class="grid" id="shelf"></div>
      </section>
    </div>
  </main>
  <script src="assets/progress.js"></script>
  <script>
    TinyFairyProgress.recordGameStart("market");
    const products = [
      { id: "apple", emoji: "🍎", name: "Táo" },
      { id: "milk", emoji: "🥛", name: "Sữa" },
      { id: "bread", emoji: "🍞", name: "Bánh mì" },
      { id: "banana", emoji: "🍌", name: "Chuối" },
      { id: "carrot", emoji: "🥕", name: "Cà rốt" },
      { id: "cookie", emoji: "🍪", name: "Bánh quy" }
    ];
    const target = { apple: 2, milk: 1, bread: 1 };
    const cart = {};

    function render() {
      document.getElementById("shopping-list").innerHTML = Object.entries(target).map(([id, count]) => {
        const product = products.find((item) => item.id === id);
        const current = cart[id] || 0;
        return `<div class="need ${current >= count ? "done" : ""}"><span>${product.emoji} ${product.name}</span><span>${current}/${count}</span></div>`;
      }).join("");
      document.getElementById("shelf").innerHTML = products.map((item) => `
        <button class="item" onclick="pick('${item.id}')"><span class="emoji">${item.emoji}</span>${item.name}</button>
      `).join("");
      const picked = Object.entries(cart).map(([id, count]) => {
        const product = products.find((item) => item.id === id);
        return `${product.emoji} x${count}`;
      });
      document.getElementById("cart").textContent = picked.length ? `Giỏ hàng: ${picked.join("  ")}` : "Giỏ hàng: đang trống";
    }

    function pick(id) {
      cart[id] = (cart[id] || 0) + 1;
      render();
      const done = Object.entries(target).every(([itemId, count]) => (cart[itemId] || 0) >= count);
      if (done) {
        TinyFairyProgress.showCompletionOverlay({
          gameId: "market",
          title: "Mua sắm xong rồi!",
          message: "Bé đã chọn đủ đồ trong danh sách và bỏ vào giỏ hàng.",
          stars: 3,
          coins: 7,
          sticker: "🛒"
        });
      }
    }

    render();
  </script>
</body>
</html>
